{% extends "base.html" %}

{% block title %}
<title>Add Cafe</title>
{% endblock %}

{% block content %}
<div class="container-fluid add_cafe">
    <p class="add_para">Add a new cafe into the database</p>
<form method="POST" class="row g-1">
    <div class="col-12">
        <label class="form-label">Cafe name</label>
        <input type="text" name="cafe" required  class="form-control form-input">
    </div>
    <div class="col-12">
        <label class="form-label">Location in google maps</label>
        <input type="text" name="location" required  class="form-control form-input">
    </div>
    <div class="col-12">
        <label class="form-label">Opening Time</label>
        <input type="text" name="open" class="form-control form-input">
    </div>
    <div class="col-12">
        <label class="form-label">Closing Time</label>
        <input type="text" name="close" class="form-control form-input">
    </div>
    <div class="col-12">
        <label class="form-label">Coffee Rating</label>
        <select class="form-select form-input" name="coffee">
         <option selected>Select...</option>
          <option value="⭐">⭐</option>
          <option value="⭐⭐">⭐⭐</option>
          <option value="⭐⭐⭐">⭐⭐⭐</option>
             <option value="⭐⭐⭐⭐">⭐⭐⭐⭐</option>
             <option value="⭐⭐⭐⭐⭐">⭐⭐⭐⭐⭐</option>
        </select>
    </div>
    <div class="col-12">
        <label class="form-label">Wifi Rating</label>
        <select class="form-select form-input" name="wifi">
          <option selected>Select...</option>
          <option value="⭐">⭐</option>
          <option value="⭐⭐">⭐⭐</option>
          <option value="⭐⭐⭐">⭐⭐⭐</option>
             <option value="⭐⭐⭐⭐">⭐⭐⭐⭐</option>
             <option value="⭐⭐⭐⭐⭐">⭐⭐⭐⭐⭐</option>
        </select>
    </div>
    <div class="col-12">
        <label class="form-label">Power Rating</label>
         <select class="form-select form-input" name="power">
          <option selected>Select...</option>
          <option value="⭐">⭐</option>
          <option value="⭐⭐">⭐⭐</option>
          <option value="⭐⭐⭐">⭐⭐⭐</option>
             <option value="⭐⭐⭐⭐">⭐⭐⭐⭐</option>
             <option value="⭐⭐⭐⭐⭐">⭐⭐⭐⭐⭐</option>
        </select>
    </div>
    <div class="col-12">
        <button class="btn btn-success">Add Cafe</button>
    </div>

</form>
</div>
{% endblock %}
