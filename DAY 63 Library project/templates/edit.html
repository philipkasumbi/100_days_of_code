{% extends "base.html" %}

{% block title %}
<title>Edit Book</title>
{% endblock %}

{% block content %}

<h1>Edit Book</h1>

<form method="POST">

    {{ form.hidden_tag() }}

    {{ form.title.label }}
    {{ form.title() }}

    {{ form.author.label }}
    {{ form.author() }}

    {{ form.rating.label }}
    {{ form.rating() }}

    <button type="submit" class="btn btn-primary">
        Update Book
    </button>

</form>

{% endblock %}
